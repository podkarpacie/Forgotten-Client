name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    name: Compile (Dockerfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (compile gate)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: forgotten-client:ci
          # The Dockerfile is the canonical Linux build path; a green build proves the
          # source compiles clean without gating on local MSVC/pinned-version assumptions.